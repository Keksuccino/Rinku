
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    compileOnly "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.2'
    implementation group: 'org.ow2.asm', name: 'asm-tree', version: '9.7'
    annotationProcessor group: 'org.ow2.asm', name: 'asm-util', version: '9.7'
    compileOnly(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    compileOnly group:'org.spongepowered', name:'mixin', version:'0.8.5'
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"
}

def generatedJcefIdentityDirectory = layout.buildDirectory.dir("generated/sources/jcefIdentity/java/main")
def generateJcefRuntimeIdentity = tasks.register("generateJcefRuntimeIdentity") {
    inputs.property("jcefCommit", rootProject.jcefCommit)
    outputs.dir(generatedJcefIdentityDirectory)
    doLast {
        def sourceFile = generatedJcefIdentityDirectory.get().file("de/keksuccino/mcef/JcefRuntimeIdentity.java").asFile
        sourceFile.parentFile.mkdirs()
        sourceFile.setText("""package de.keksuccino.mcef;

/** Build-generated identity binding the Java API and downloaded native runtime to one JCEF release. */
final class JcefRuntimeIdentity {
    static final String JAVA_CEF_COMMIT = \"${rootProject.jcefCommit}\";

    private JcefRuntimeIdentity() {
    }
}
""", "UTF-8")
    }
}

sourceSets.main.java.srcDir(generatedJcefIdentityDirectory)

tasks.named("compileJava", JavaCompile).configure {
    dependsOn(generateJcefRuntimeIdentity)
}

tasks.named("sourcesJar", Jar).configure {
    dependsOn(generateJcefRuntimeIdentity)
}

tasks.named("test", Test).configure {
    useJUnitPlatform()
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}
