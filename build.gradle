
plugins {
    // Required for generated IntelliJ source registration in the common module.
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

tasks.named("updateDaemonJvm") {
    jvmVersion = JavaLanguageVersion.of(providers.gradleProperty("java_version").get().toInteger())
}

def rawJcefCommit = providers.gradleProperty("jcef_commit").orNull
if (rawJcefCommit == null || !(rawJcefCommit ==~ /[0-9a-f]{40}/)) {
    throw new GradleException("gradle.properties jcef_commit must contain exactly one lowercase 40-character hexadecimal Git commit.")
}

ext.jcefCommit = rawJcefCommit

def jcefReleaseGroup = "java-cef"

subprojects {

    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    java.withSourcesJar()
//    java.withJavadocJar()

    def jcefApi = configurations.create("jcefApi") {
        canBeConsumed = false
        canBeResolved = false
    }
    def jcefBinary = configurations.create("jcefBinary") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
        extendsFrom(jcefApi)
    }
    def jcefSources = configurations.create("jcefSources") {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
    configurations.named("compileOnly") {
        extendsFrom(jcefApi)
    }
    configurations.named("testCompileOnly") {
        extendsFrom(jcefApi)
    }
    dependencies.add(jcefApi.name, "${jcefReleaseGroup}:jcef-rinku:${jcefCommit}@jar")
    dependencies.add(jcefSources.name, "${jcefReleaseGroup}:jcef-rinku:${jcefCommit}:sources@jar")

    def binaryJar = tasks.named('jar', Jar)
    def sourceJar = tasks.named('sourcesJar', Jar)
    def jcefBinaryContents = providers.provider { zipTree(jcefBinary.singleFile) }
    def jcefSourceContents = providers.provider { zipTree(jcefSources.singleFile) }

    sourceSets.main.runtimeClasspath += jcefBinary
    sourceSets.test.runtimeClasspath += jcefBinary

    binaryJar.configure { Jar archiveTask ->
        archiveTask.from(jcefBinaryContents) {
            include 'org/cef/**'
        }
        archiveTask.from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        archiveTask.from(rootProject.file("licenses/JCEF-LICENSE.txt")) {
            into "META-INF/licenses/jcef"
            rename { "LICENSE.txt" }
        }
        archiveTask.manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : mod_version,
                    'Implementation-Title'    : mod_name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors,
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version,
                    'java-cef-commit'         : jcefCommit
            ])
        }
    }

    sourceJar.configure { Jar archiveTask ->
        archiveTask.from(jcefSourceContents) {
            include 'org/cef/**/*.java'
        }
        archiveTask.from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        archiveTask.from(rootProject.file("licenses/JCEF-LICENSE.txt")) {
            into "META-INF/licenses/jcef"
            rename { "LICENSE.txt" }
        }
        archiveTask.manifest {
            attributes('java-cef-commit': jcefCommit)
        }
    }

    def binaryArchives = objects.fileCollection()
    binaryArchives.from(binaryJar.flatMap { it.archiveFile })
    ext.jcefPackagedBinaryArchives = binaryArchives
    def verifyJcefPackaging = tasks.register('verifyJcefPackaging') {
        dependsOn binaryJar, sourceJar
        inputs.files(binaryArchives)
        inputs.file(sourceJar.flatMap { it.archiveFile })
        inputs.files(jcefBinary, jcefSources)
        inputs.file(rootProject.file("licenses/JCEF-LICENSE.txt"))
        inputs.property('jcefCommit', jcefCommit)
        doLast {
            def jcefBinaryFile = jcefBinary.singleFile
            if (!sourceSets.main.compileClasspath.files.contains(jcefBinaryFile)) throw new GradleException("${project.path} does not use the pinned JCEF binary on its compile classpath.")
            if (!sourceSets.main.runtimeClasspath.files.contains(jcefBinaryFile)) throw new GradleException("${project.path} does not use the pinned JCEF binary on its development runtime classpath.")
            def upstreamBinaryEntries = new java.util.jar.JarFile(jcefBinary.singleFile).withCloseable { archive -> archive.entries().findAll { !it.directory && it.name.startsWith('org/cef/') }.collect { it.name }.toSet() }
            def upstreamSourceEntries = new java.util.jar.JarFile(jcefSources.singleFile).withCloseable { archive -> archive.entries().findAll { !it.directory && it.name.startsWith('org/cef/') && it.name.endsWith('.java') }.collect { it.name }.toSet() }
            def expectedLicense = rootProject.file("licenses/JCEF-LICENSE.txt").bytes
            binaryArchives.files.each { archiveFile ->
                new java.util.jar.JarFile(archiveFile).withCloseable { archive ->
                    def entries = archive.entries().findAll { !it.directory }.collect { it.name }.toSet()
                    def missingEntries = upstreamBinaryEntries - entries
                    if (!missingEntries.isEmpty()) throw new GradleException("${archiveFile} is missing ${missingEntries.size()} flat-merged JCEF binary entries, beginning with ${missingEntries.first()}.")
                    if (entries.any { it == 'jcef-rinku.jar' || it.endsWith('/jcef-rinku.jar') }) throw new GradleException("${archiveFile} contains a nested jcef-rinku.jar instead of flat-merged classes.")
                    def actualCommit = archive.manifest?.mainAttributes?.getValue('java-cef-commit')
                    if (actualCommit != jcefCommit) throw new GradleException("${archiveFile} records java-cef commit ${actualCommit ?: '<missing>'}; expected ${jcefCommit}.")
                    def licenseEntry = archive.getJarEntry('META-INF/licenses/jcef/LICENSE.txt')
                    if (licenseEntry == null || !java.util.Arrays.equals(archive.getInputStream(licenseEntry).readAllBytes(), expectedLicense)) throw new GradleException("${archiveFile} does not contain the exact upstream JCEF license at META-INF/licenses/jcef/LICENSE.txt.")
                }
            }
            def sourceArchiveFile = sourceJar.get().archiveFile.get().asFile
            new java.util.jar.JarFile(sourceArchiveFile).withCloseable { archive ->
                def entries = archive.entries().findAll { !it.directory }.collect { it.name }.toSet()
                def missingEntries = upstreamSourceEntries - entries
                if (!missingEntries.isEmpty()) throw new GradleException("${sourceArchiveFile} is missing ${missingEntries.size()} flat-merged JCEF source entries, beginning with ${missingEntries.first()}.")
                def actualCommit = archive.manifest?.mainAttributes?.getValue('java-cef-commit')
                if (actualCommit != jcefCommit) throw new GradleException("${sourceArchiveFile} records java-cef commit ${actualCommit ?: '<missing>'}; expected ${jcefCommit}.")
                def licenseEntry = archive.getJarEntry('META-INF/licenses/jcef/LICENSE.txt')
                if (licenseEntry == null || !java.util.Arrays.equals(archive.getInputStream(licenseEntry).readAllBytes(), expectedLicense)) throw new GradleException("${sourceArchiveFile} does not contain the exact upstream JCEF license at META-INF/licenses/jcef/LICENSE.txt.")
            }
        }
    }

    tasks.named('check') {
        dependsOn verifyJcefPackaging
    }

    repositories {
        mavenCentral()

        exclusiveContent {
            forRepository {
                ivy {
                    name = "Keksuccino JCEF GitHub Releases"
                    url = uri("https://github.com/Keksuccino/jcef-rinku/releases/download")
                    patternLayout {
                        // GitHub publishes java-cef-<commit>/jcef-rinku[-sources].jar, so the
                        // synthetic organization and revision map directly to the release URL.
                        artifact "[organization]-[revision]/[module](-[classifier]).[ext]"
                    }
                    metadataSources {
                        artifact()
                    }
                }
            }
            filter {
                includeGroup(jcefReleaseGroup)
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge / Mixin'
                    url = 'https://repo.spongepowered.org/repository/maven-public/'
                }
            }
            filter {
                includeGroup 'org.spongepowered'
                includeGroup 'org.spongepowered.mixin'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseMaven"
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "JitPack"
                    url = 'https://jitpack.io'
                }
            }
            filter {
                includeGroup 'com.github.rtyley'
                includeGroup 'com.github.DhyanB'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Keksuccino"
                    url = "https://keksuccino.github.io/maven/"
                }
            }
            filter {
                includeGroupByRegex 'com\\.github\\.Keksuccino(\\..*)?'
                includeGroupByRegex 'com\\.keksuccino(\\..*)?'
                includeGroupByRegex 'de\\.keksuccino(\\..*)?'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC Maven'
                    url = 'https://maven.parchmentmc.org'
                }
            }
            filter {
                includeGroupByRegex 'org\\.parchmentmc(\\..*)?'
            }
        }
        // Crystal Nest repository where Fancy Entity Renderer is hosted.
        exclusiveContent {
            forRepository {
                maven {
                    name = "Crystal Nest"
                    url = "https://maven.crystalnest.it"
                }
            }
            filter {
                includeGroup "it.crystalnest"
            }
        }
    }

    dependencies {
        components.all { component ->
            def id = component.id
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                def stableGroups = [
                        'maven.modrinth',
                        'curse.maven',
                        'com.github.Keksuccino',
                        'com.github.rtyley',
                        'net.fabricmc',
                        'net.fabricmc.fabric-api',
                        'net.minecraftforge',
                        'org.spongepowered',
                        'com.cinemamod',
                        'org.parchmentmc',
                        'org.parchmentmc.data'
                ]
                if (id.group in stableGroups) {
                    component.changing = false
                }
            }
        }
    }

    if (providers.gradleProperty("rinku.enableDependencyLocking").map { it.toBoolean() }.orElse(false).get()) {
        dependencyLocking {
            // Enable with -Prinku.enableDependencyLocking=true and generate/update locks via:
            // ./gradlew --write-locks <task>
            lockMode = org.gradle.api.artifacts.dsl.LockMode.LENIENT
            lockAllConfigurations()
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 168, 'hours'
            cacheDynamicVersionsFor 168, 'hours'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(java_version.toInteger())
        it.options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
    }

    tasks.withType(Test).configureEach {
        systemProperty "rinku.test.jcefCommit", jcefCommit
        systemProperty "rinku.test.projectDir", rootProject.projectDir.absolutePath
    }

    processResources {
        def expandProps = [
                "group": project.group,
                "mod_name": mod_name,
                "mod_id": mod_id,
                "mod_version": mod_version,
                "mod_description": mod_description,
                "mod_license": mod_license,
                "mod_authors": mod_authors,
                "minecraft_version": minecraft_version,
                "java_version": java_version,
                "jcef_commit": jcefCommit,
                "fabric_version": fabric_version,
                "fabric_short_version": fabric_short_version,
                "fabric_loader_version": fabric_loader_version,
                "forge_version": forge_version,
                "forge_loader_version": forge_loader_version,
                "forge_mappings_channel": forge_mappings_channel,
                "parchment_version": parchment_version,
                "parchment_mc_version": parchment_mc_version,
                "mixin_extras_version": mixin_extras_version,
                "fabric_loom_version": fabric_loom_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs every subproject check.'
    dependsOn subprojects.collect { subproject -> subproject.tasks.named('check') }
}
