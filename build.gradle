
import de.keksuccino.gradle.JcefArchiveProvenance
import de.keksuccino.gradle.JcefProvenance

plugins {
    // Required for NeoGradle
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

tasks.named("updateDaemonJvm") {
    languageVersion = JavaLanguageVersion.of(providers.gradleProperty("java_version").get().toInteger())
    toolchainPlatforms = []
}

def getJcefRepoUrl(Project project) {
    def defaultUrl = "https://github.com/Keksuccino/jcef-mcef.git"
    def modulesFile = project.file('.gitmodules')
    if (!modulesFile.exists()) {
        return defaultUrl
    }

    def inJcefSection = false
    for (String rawLine : modulesFile.readLines()) {
        def line = rawLine.trim()
        if (line.startsWith('[submodule ')) {
            inJcefSection = line == '[submodule "common/java-cef"]'
            continue
        }
        if (inJcefSection && line.startsWith('url =')) {
            return line.substring('url ='.length()).trim()
        }
    }
    return defaultUrl
}

def runGit(Project project, List<String> args, boolean failOnError = true) {
    try {
        def result = JcefProvenance.runGit(project.rootDir.toPath(), args, failOnError)
        return [exitValue: result.exitCode(), output: result.output()]
    } catch (IllegalStateException exception) {
        throw new GradleException(exception.message, exception)
    }
}

def isTrackedSubmodule(Project project, String submodulePath) {
    try {
        return JcefProvenance.isTrackedSubmodule(project.rootDir.toPath(), submodulePath)
    } catch (IllegalStateException exception) {
        throw new GradleException(exception.message, exception)
    }
}

tasks.register('syncJcef') {
    doLast {
        def jcefPath = 'common/java-cef'
        def trackedAsSubmodule = isTrackedSubmodule(rootProject, jcefPath)

        if (trackedAsSubmodule) {
            runGit(rootProject, ['submodule', 'sync', '--', jcefPath])
        }
    }
}

tasks.register('cloneJcef') {
    dependsOn 'syncJcef'
    doLast {
        def jcefPath = 'common/java-cef'
        def jcefDir = rootProject.file(jcefPath)
        def repoUrl = getJcefRepoUrl(rootProject)
        def trackedAsSubmodule = isTrackedSubmodule(rootProject, jcefPath)

        if (trackedAsSubmodule) {
            if (!JcefProvenance.hasGitMetadata(jcefDir.toPath())) {
                runGit(rootProject, ['submodule', 'update', '--init', '--recursive', '--', jcefPath])
            }
            // Never move an initialized checkout. Provenance validation below must reject a
            // mismatched or dirty checkout instead of silently compiling different source.
            return
        }

        if (JcefProvenance.hasGitMetadata(jcefDir.toPath())) {
            return
        }

        if (jcefDir.exists()) {
            def contents = jcefDir.listFiles()
            if (contents != null && contents.length > 0) {
                throw new GradleException("Cannot clone java-cef into ${jcefDir}: directory exists and is not empty.")
            }
        }

        logger.lifecycle("java-cef is not tracked as a submodule in this checkout; cloning directly from ${repoUrl}.")
        runGit(rootProject, ['clone', '--recursive', repoUrl, jcefDir.absolutePath])
    }
}

def jcefCommitFile = layout.buildDirectory.file('jcef-provenance/java-cef-commit.txt')
def capturedJcefCommit = providers.fileContents(jcefCommitFile).asText.map { it.trim() }
def captureJcefProvenance = tasks.register('captureJcefProvenance') {
    dependsOn 'cloneJcef'
    outputs.file(jcefCommitFile)
    outputs.upToDateWhen { false }
    doLast {
        try {
            def resolution = JcefProvenance.resolve(rootProject.rootDir.toPath(), 'common/java-cef')
            def outputFile = jcefCommitFile.get().asFile
            outputFile.parentFile.mkdirs()
            outputFile.setText("${resolution.commit()}\n", 'UTF-8')
        } catch (IllegalStateException exception) {
            throw new GradleException(exception.message, exception)
        }
    }
}
def revalidateJcefProvenance = {
    def capturedCommit = capturedJcefCommit.get()
    try {
        def current = JcefProvenance.resolve(rootProject.rootDir.toPath(), 'common/java-cef').commit()
        if (current != capturedCommit) {
            throw new GradleException("java-cef changed after provenance capture (${capturedCommit} -> ${current}).")
        }
    } catch (IllegalStateException exception) {
        throw new GradleException(exception.message, exception)
    }
    return capturedCommit
}
def configureJcefArchiveProvenance = { Jar archiveTask ->
    JcefArchiveProvenance.configure(archiveTask, captureJcefProvenance, jcefCommitFile, revalidateJcefProvenance)
}

subprojects {

    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(java_version.toInteger())
    java.withSourcesJar()
//    java.withJavadocJar()

    def provenanceArchives = tasks.withType(Jar)
    provenanceArchives.configureEach { Jar archiveTask ->
        configureJcefArchiveProvenance(archiveTask)
    }

    def binaryJar = tasks.named('jar', Jar)
    def sourceJar = tasks.named('sourcesJar', Jar)

    binaryJar.configure { Jar archiveTask ->
        archiveTask.from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        archiveTask.manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : mod_version,
                    'Implementation-Title'    : mod_name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors,
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version
            ])
        }
    }

    sourceJar.configure { Jar archiveTask ->
        archiveTask.from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }

    def verifyJcefArchiveProvenance = tasks.register('verifyJcefArchiveProvenance') {
        dependsOn provenanceArchives
        inputs.files(provenanceArchives)
        inputs.file(jcefCommitFile)
        doLast {
            def expectedCommit = revalidateJcefProvenance()
            provenanceArchives.each { archiveTask ->
                def archiveFile = archiveTask.archiveFile.get().asFile
                new java.util.jar.JarFile(archiveFile).withCloseable { archive ->
                    def actualCommit = archive.manifest?.mainAttributes?.getValue('java-cef-commit')
                    if (actualCommit != expectedCommit) {
                        throw new GradleException("${archiveFile} records java-cef commit ${actualCommit ?: '<missing>'}; expected ${expectedCommit}.")
                    }
                }
            }
        }
    }

    tasks.named('check') {
        dependsOn verifyJcefArchiveProvenance
    }

    repositories {
        mavenCentral()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge / Mixin'
                    url = 'https://repo.spongepowered.org/repository/maven-public/'
                }
            }
            filter {
                includeGroup 'org.spongepowered'
                includeGroup 'org.spongepowered.mixin'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseMaven"
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "JitPack"
                    url = 'https://jitpack.io'
                }
            }
            filter {
                includeGroup 'com.github.rtyley'
                includeGroup 'com.github.DhyanB'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Keksuccino"
                    url = "https://keksuccino.github.io/maven/"
                }
            }
            filter {
                includeGroupByRegex 'com\\.github\\.Keksuccino(\\..*)?'
                includeGroupByRegex 'com\\.keksuccino(\\..*)?'
                includeGroupByRegex 'de\\.keksuccino(\\..*)?'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC Maven'
                    url = 'https://maven.parchmentmc.org'
                }
            }
            filter {
                includeGroupByRegex 'org\\.parchmentmc(\\..*)?'
            }
        }
        // Crystal Nest repository where Fancy Entity Renderer is hosted.
        exclusiveContent {
            forRepository {
                maven {
                    name = "Crystal Nest"
                    url = "https://maven.crystalnest.it"
                }
            }
            filter {
                includeGroup "it.crystalnest"
            }
        }
    }

    dependencies {
        components.all { component ->
            def id = component.id
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                def stableGroups = [
                        'maven.modrinth',
                        'curse.maven',
                        'com.github.Keksuccino',
                        'com.github.rtyley',
                        'net.fabricmc',
                        'net.fabricmc.fabric-api',
                        'net.minecraftforge',
                        'net.neoforged',
                        'org.spongepowered',
                        'com.cinemamod',
                        'org.parchmentmc',
                        'org.parchmentmc.data'
                ]
                if (id.group in stableGroups) {
                    component.changing = false
                }
            }
        }
    }

    if (providers.gradleProperty("mcef.enableDependencyLocking").map { it.toBoolean() }.orElse(false).get()) {
        dependencyLocking {
            // Enable with -Pmcef.enableDependencyLocking=true and generate/update locks via:
            // ./gradlew --write-locks <task>
            lockMode = org.gradle.api.artifacts.dsl.LockMode.LENIENT
            lockAllConfigurations()
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 168, 'hours'
            cacheDynamicVersionsFor 168, 'hours'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        dependsOn captureJcefProvenance
        // Compiler inputs are checked on both sides of javac so a checkout change cannot leave
        // bytecode carrying the earlier provenance capture. Archive tasks validate once more.
        doFirst { revalidateJcefProvenance() }
        doLast { revalidateJcefProvenance() }
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(java_version.toInteger())
        it.options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
    }

    tasks.withType(ProcessResources).configureEach {
        dependsOn captureJcefProvenance
    }

    processResources {
        def expandProps = [
                "group": project.group,
                "mod_name": mod_name,
                "mod_id": mod_id,
                "mod_version": mod_version,
                "mod_description": mod_description,
                "mod_license": mod_license,
                "mod_authors": mod_authors,
                "minecraft_version": minecraft_version,
                "java_version": java_version,
                "fabric_version": fabric_version,
                "fabric_short_version": fabric_short_version,
                "fabric_loader_version": fabric_loader_version,
                "neoforge_version": neoforge_version,
                "neoforge_loader_version": neoforge_loader_version,
                "parchment_version": parchment_version,
                "parchment_mc_version": parchment_mc_version,
                "mixin_extras_version": mixin_extras_version,
                "fabric_loom_version": fabric_loom_version,
                "neogradle_version": neogradle_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

}

tasks.register('verifyAll') {
    group = 'verification'
    description = 'Runs every subproject check; use verify-all.sh or verify-all.bat to include buildSrc tests.'
    dependsOn subprojects.collect { subproject -> subproject.tasks.named('check') }
}
