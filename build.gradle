
plugins {
    // Required for NeoGradle
    id "org.jetbrains.gradle.plugin.idea-ext" version "1.3"
}

tasks.register('cloneJcef', Exec) {
    dependsOn 'syncJcef'
    commandLine 'git', 'submodule', 'update', '--init', '--recursive', 'common/java-cef'
}

tasks.register('syncJcef', Exec) {
    commandLine 'git', 'submodule', 'sync', '--', 'common/java-cef'
}

// https://gist.github.com/JonasGroeger/7620911
def getCheckedOutGitCommitHash(Project mcefParent) {
    def gitFolder = "$mcefParent.projectDir/.git/modules/common/java-cef/"
    def takeFromHash = 40
    /*
     * '.git/HEAD' contains either
     *      in case of detached head: the currently checked out commit hash
     *      otherwise: a reference to a file containing the current commit hash
     */
    def gitHeadFile = new File(gitFolder + "HEAD")
    if (gitHeadFile.exists()) {
        def head = gitHeadFile.text.split(":") // .git/HEAD
        def isCommit = head.length == 1 // e5a7c79edabbf7dd39888442df081b1c9d8e88fd
        // def isRef = head.length > 1     // ref: refs/heads/master

        if (isCommit) return head[0].trim().take(takeFromHash) // e5a7c79edabb

        def refHead = new File(gitFolder + head[1].trim()) // .git/refs/heads/master
        refHead.text.trim().take takeFromHash
    } else {
        return ""
    }
}

subprojects {

    apply plugin: 'java'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)
    java.withSourcesJar()
//    java.withJavadocJar()

    jar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
        manifest {
            attributes([
                    'Specification-Title'     : mod_name,
                    'Specification-Vendor'    : mod_authors,
                    'Specification-Version'   : mod_version,
                    'Implementation-Title'    : mod_name,
                    'Implementation-Version'  : mod_version,
                    'Implementation-Vendor'   : mod_authors,
                    'Built-On-Java'           : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                    'Built-On-Minecraft'      : minecraft_version,
                    'java-cef-commit'         : getCheckedOutGitCommitHash(rootProject)
            ])
        }
    }

    sourcesJar {
        from(rootProject.file("LICENSE")) {
            rename { "${it}_${mod_name}" }
        }
    }

    repositories {
        mavenCentral()

        exclusiveContent {
            forRepository {
                maven {
                    name = 'Sponge / Mixin'
                    url = 'https://repo.spongepowered.org/repository/maven-public/'
                }
            }
            filter {
                includeGroup 'org.spongepowered'
                includeGroup 'org.spongepowered.mixin'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "CurseMaven"
                    url = "https://cursemaven.com"
                }
            }
            filter {
                includeGroup "curse.maven"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Modrinth"
                    url = "https://api.modrinth.com/maven"
                }
            }
            filter {
                includeGroup "maven.modrinth"
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "JitPack"
                    url = 'https://jitpack.io'
                }
            }
            filter {
                includeGroup 'com.github.rtyley'
                includeGroup 'com.github.DhyanB'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = "Keksuccino"
                    url = "https://keksuccino.github.io/maven/"
                }
            }
            filter {
                includeGroupByRegex 'com\\.github\\.Keksuccino(\\..*)?'
                includeGroupByRegex 'com\\.keksuccino(\\..*)?'
                includeGroupByRegex 'de\\.keksuccino(\\..*)?'
            }
        }

        exclusiveContent {
            forRepository {
                maven {
                    name = 'ParchmentMC Maven'
                    url = 'https://maven.parchmentmc.org'
                }
            }
            filter {
                includeGroupByRegex 'org\\.parchmentmc(\\..*)?'
            }
        }
        // Crystal Nest repository where Fancy Entity Renderer is hosted.
        exclusiveContent {
            forRepository {
                maven {
                    name = "Crystal Nest"
                    url = "https://maven.crystalnest.it"
                }
            }
            filter {
                includeGroup "it.crystalnest"
            }
        }
    }

    dependencies {
        components.all { component ->
            def id = component.id
            if (id instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier) {
                def stableGroups = [
                        'maven.modrinth',
                        'curse.maven',
                        'com.github.Keksuccino',
                        'com.github.rtyley',
                        'net.fabricmc',
                        'net.fabricmc.fabric-api',
                        'net.minecraftforge',
                        'net.neoforged',
                        'org.spongepowered',
                        'com.cinemamod',
                        'org.parchmentmc',
                        'org.parchmentmc.data'
                ]
                if (id.group in stableGroups) {
                    component.changing = false
                }
            }
        }
    }

    if (providers.gradleProperty("mcef.enableDependencyLocking").map { it.toBoolean() }.orElse(false).get()) {
        dependencyLocking {
            // Enable with -Pmcef.enableDependencyLocking=true and generate/update locks via:
            // ./gradlew --write-locks <task>
            lockMode = org.gradle.api.artifacts.dsl.LockMode.LENIENT
            lockAllConfigurations()
        }
    }

    configurations.configureEach {
        resolutionStrategy {
            cacheChangingModulesFor 168, 'hours'
            cacheDynamicVersionsFor 168, 'hours'
        }
    }

    tasks.withType(JavaCompile).configureEach {
        it.options.encoding = 'UTF-8'
        it.options.getRelease().set(21)
        it.options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
    }

    processResources {
        def expandProps = [
                "group": project.group,
                "mod_name": mod_name,
                "mod_id": mod_id,
                "mod_version": mod_version,
                "mod_description": mod_description,
                "mod_license": mod_license,
                "mod_authors": mod_authors,
                "minecraft_version": minecraft_version,
                "fabric_version": fabric_version,
                "fabric_short_version": fabric_short_version,
                "fabric_loader_version": fabric_loader_version,
                "neoforge_version": neoforge_version,
                "neoforge_loader_version": neoforge_loader_version,
                "parchment_version": parchment_version,
                "parchment_mc_version": parchment_mc_version,
                "mixin_extras_version": mixin_extras_version,
                "fabric_loom_version": fabric_loom_version,
                "neogradle_version": neogradle_version
        ]
        filesMatching(['pack.mcmeta', 'fabric.mod.json', 'META-INF/mods.toml', 'META-INF/neoforge.mods.toml', '*.mixins.json']) {
            expand expandProps
        }
        inputs.properties(expandProps)
    }

    // Disables Gradle's custom module metadata from being published to maven. The
    // metadata includes mapped dependencies which are not reasonably consumable by
    // other mod developers.
    tasks.withType(GenerateModuleMetadata).configureEach {
        enabled = false
    }

}
