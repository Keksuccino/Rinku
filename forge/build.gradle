
plugins {
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
    id 'org.parchmentmc.librarian.forgegradle' version '1.+'
    id 'org.spongepowered.mixin' version '0.7-SNAPSHOT'
    id 'java-library'
}

base {
    archivesName = "${mod_id}"
}

mixin {
    add(sourceSets.main, "${mod_id}.refmap.json")
    config("${mod_id}.mixins.json")
    config("${mod_id}.forge.mixins.json")
}

jarJar.enable()

def forgeMappingsChannel = providers.gradleProperty("forge_mappings_channel")
        .map { it.trim().toLowerCase(java.util.Locale.ROOT) }
        .orElse("parchment")
        .get()
def supportedForgeMappings = ['official', 'stable', 'snapshot', 'stable_nodoc', 'snapshot_nodoc', 'parchment']
if (!(forgeMappingsChannel in supportedForgeMappings)) {
    throw new GradleException("Unsupported ForgeGradle 6 mapping channel '${forgeMappingsChannel}'. Supported channels: ${supportedForgeMappings}.")
}
def defaultParchmentMappingsVersion = parchment_mc_version == minecraft_version
        ? "${parchment_version}-${minecraft_version}"
        : "${parchment_mc_version}-${parchment_version}-${minecraft_version}"
def forgeMappingsVersion = providers.gradleProperty("forge_mappings_version")
        .orElse(forgeMappingsChannel == "parchment" ? defaultParchmentMappingsVersion : "${minecraft_version}")
        .get()
def javaCefCommit = (rootProject.ext.has("javaCefCommitHash") ? rootProject.ext.javaCefCommitHash : "").toString().trim()

minecraft {

    mappings channel: forgeMappingsChannel, version: forgeMappingsVersion

    // Required so ProcessResources runs before IDE launches.
    copyIdeResources = true

    // Automatically enable Forge AccessTransformers if the file exists.
    // This location is hardcoded in Forge and can not be changed.
    if (file('src/main/resources/META-INF/accesstransformer.cfg').exists()) {
        accessTransformer = file('src/main/resources/META-INF/accesstransformer.cfg')
    }

    runs {
        client {
            workingDirectory project.file('../run_client')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Client'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            if (!javaCefCommit.isEmpty()) {
                property 'mcef.java.cef.commit', javaCefCommit
            }
            mods {
                modClientRun {
                    source sourceSets.main
                }
            }
        }
        server {
            workingDirectory project.file('../run_server')
            ideaModule "${rootProject.name}.${project.name}.main"
            taskName 'Server'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            if (!javaCefCommit.isEmpty()) {
                property 'mcef.java.cef.commit', javaCefCommit
            }
            mods {
                modServerRun {
                    source sourceSets.main
                }
            }
        }
    }

}

// Temporarily disabled tests to avoid launcher-specific test task issues during normal development builds.
test {
    exclude '**/*'
}

sourceSets.main.resources.srcDir 'src/generated/resources'

dependencies {
    minecraft("net.minecraftforge:forge:${minecraft_version}-${forge_version}")
    implementation('net.sf.jopt-simple:jopt-simple:5.0.4') { version { strictly '5.0.4' } }
    annotationProcessor("org.spongepowered:mixin:0.8.5-SNAPSHOT:processor")
    // Needs to be "implementation" when building and "compileOnly" in-dev.
    implementation(annotationProcessor("io.github.llamalad7:mixinextras-common:${mixin_extras_version}"))
    implementation(jarJar("io.github.llamalad7:mixinextras-forge:${mixin_extras_version}")) {
        jarJar.ranged(it, "[${mixin_extras_version},)")
    }
    compileOnly project(":common")
}

// Exclude Fabric Loader from Forge
configurations {
    runtimeClasspath { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    developmentRuntimeClasspath {
        // Gradle 8 names used by ForgeGradle 6
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
}

tasks.withType(JavaCompile).configureEach {
    source(project(":common").sourceSets.main.allSource)
    source(project(":common").sourceSets.jcef.allSource)
    it.options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
}

tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    from(project(":common").sourceSets.main.allSource)
    from(project(":common").sourceSets.jcef.allSource)
}

processResources {
    from(project(":common").sourceSets.main.resources)
}

jar.finalizedBy('reobfJar')

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId "${mod_id}-forge"
            version "${mod_version}-${minecraft_version}"
            from components.java
            fg.component(it)
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

jar {
    manifest {
        attributes([
                "MixinConfigs": "${mod_id}.forge.mixins.json,${mod_id}.mixins.json"
        ])
    }
}
