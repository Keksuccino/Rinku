
import net.neoforged.gradle.common.runtime.tasks.DownloadAssets

plugins {
    id 'idea'
    id 'maven-publish'
    id "net.neoforged.gradle.userdev" version "$neogradle_version"
    id 'java-library'
}

base {
    archivesName = "${mod_id}"
}

runs {
    configureEach {
        modSource project.sourceSets.main
    }
    client {
        workingDirectory project.file('../run_client')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        dependencies {
            // NeoGradle isolates non-Minecraft run libraries from sourceSets.main.runtimeClasspath.
            // Keep this tied to the shared notation so development runs use the same pinned JCEF build that is flat-merged into releases.
            runtime rootProject.jcefBinaryDependencyNotation
        }
    }
    server {
        workingDirectory project.file('../run_server')
        systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        arguments.add('--nogui')
    }
}

tasks.withType(JavaExec).configureEach {
    if (name == "runClient" || name == "runServer") {
        standardInput = System.in
    }
}

// NeoGradle 7.1 defaults every Minecraft version to asset-index.json, so parallel multi-version runs overwrite one another.
// Mojang's real asset ID gives this run a stable index and keeps its generated --assetIndex argument version-correct.
tasks.withType(DownloadAssets).configureEach {
    assetIndex.set(versionJson.map { it.assetIndex.id })
}

def clientRun = runs.named("client")
def verifyNeoForgeDevelopmentRuntime = tasks.register("verifyNeoForgeDevelopmentRuntime") {
    dependsOn(tasks.withType(DownloadAssets))
    inputs.files(clientRun.map { it.dependencies.runtimeConfiguration })
    inputs.files(configurations.jcefBinary)
    inputs.property("jcefCommit", rootProject.jcefCommit)
    doLast {
        File expectedJcef = configurations.jcefBinary.singleFile.canonicalFile
        Set<File> runClasspath = clientRun.get().dependencies.runtimeConfiguration.files.collect { it.canonicalFile }.toSet()
        if (!runClasspath.contains(expectedJcef)) throw new GradleException("NeoForge's client development runtime does not contain pinned JCEF binary ${expectedJcef}.")

        List<DownloadAssets> assetTasks = tasks.withType(DownloadAssets).toList()
        if (assetTasks.size() != 1) throw new GradleException("Expected one NeoForge asset task, found ${assetTasks.size()}.")
        DownloadAssets assetTask = assetTasks.first()
        String expectedAssetIndex = assetTask.versionJson.get().assetIndex.id
        File actualAssetIndex = assetTask.assetIndexTargetFile.get().asFile
        if (assetTask.assetIndex.get() != expectedAssetIndex || actualAssetIndex.name != "${expectedAssetIndex}.json") throw new GradleException("NeoForge's client development runtime does not use Mojang asset index ${expectedAssetIndex}.")
        if (!actualAssetIndex.isFile()) throw new GradleException("NeoForge's client asset index was not downloaded to ${actualAssetIndex}.")
    }
}

tasks.named("check").configure {
    dependsOn(verifyNeoForgeDevelopmentRuntime)
}

//Temporarily disabled tests so compiling doesn't fail until I figure out why tf neoforge:test fails
test {
    exclude '**/*'
}

sourceSets {
    main.resources { srcDir 'src/generated/resources' }
    bootstrap {
        runtimeClasspath += output + compileClasspath
    }
    bootstrapTest {
        compileClasspath += sourceSets.bootstrap.output
        runtimeClasspath += output + compileClasspath + sourceSets.bootstrap.output
    }
}

jarJar.enable()

subsystems {
    parchment {
        minecraftVersion = "${parchment_mc_version}"
        mappingsVersion = "${parchment_version}"
    }
}

dependencies {
    testImplementation("org.junit.jupiter:junit-jupiter-api:5.10.2")
    testRuntimeOnly("org.junit.jupiter:junit-jupiter-engine:5.10.2")
    testRuntimeOnly("org.junit.platform:junit-platform-launcher:1.10.2")
    implementation "net.neoforged:neoforge:${neoforge_version}"
    //Also needs to get added to the client run configuration (runs -> client -> dependencies) since it's a non-Minecraft library
//    implementation(jarJar("com.github.DhyanB:Open-Imaging:317b2cb6e5")) {
//        jarJar.ranged(it, "[317b2cb6e5,)")
//    }
    compileOnly project(":common")
}

// Exclude Fabric Loader from NeoForge
configurations {
    bootstrapImplementation.extendsFrom implementation
    bootstrapCompileOnly.extendsFrom compileOnly
    bootstrapTestImplementation.extendsFrom testImplementation
    bootstrapTestRuntimeOnly.extendsFrom testRuntimeOnly
    runtimeClasspath    { exclude group: 'net.fabricmc', module: 'fabric-loader' }
    developmentRuntimeClasspath {
        // Gradle 8 names used by ForgeGradle 6
        exclude group: 'net.fabricmc', module: 'fabric-loader'
    }
}

// NeoGradle compiles the game, but we don't want to add our common code to the game's code++
Spec<Task> notNeoTask = { Task it -> !it.name.startsWith("neo") } as Spec<Task>

tasks.named("compileJava", JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
}

tasks.withType(JavaCompile).matching(notNeoTask).configureEach {
    it.options.compilerArgs += ['-Xlint:-deprecation', '-Xlint:-removal']
}

tasks.withType(Javadoc).matching(notNeoTask).configureEach {
    source(project(":common").sourceSets.main.allJava)
}

tasks.named("sourcesJar", Jar) {
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
    from(project(":common").sourceSets.main.allSource)
    from(sourceSets.bootstrap.allSource)
}

tasks.named("processResources", ProcessResources).configure {
    from project(":common").sourceSets.main.resources
}

def nestedModBaseJar = tasks.named("jar", Jar) {
    archiveClassifier = "mod-base"
    manifest {
        attributes("Automatic-Module-Name": mod_id)
    }
}
def nestedModJar = tasks.named("jarJar", Jar) {
    archiveClassifier = "mod"
}
def distributionVersion = "${mod_version}-${minecraft_version}"
def nestedModArtifact = "${mod_id}-neoforge"
def nestedModFileName = "${project.group}.${nestedModArtifact}-${distributionVersion}-mod.jar"
def nestedModPath = "META-INF/jarjar/${nestedModFileName}"
def bootstrapMetadataFile = layout.buildDirectory.file("generated/rinkuBootstrap/META-INF/jarjar/metadata.json")

def generateBootstrapMetadata = tasks.register("generateBootstrapMetadata") {
    inputs.property("group", project.group.toString())
    inputs.property("artifact", nestedModArtifact)
    inputs.property("version", distributionVersion)
    inputs.property("path", nestedModPath)
    outputs.file(bootstrapMetadataFile)
    doLast {
        def metadataFile = bootstrapMetadataFile.get().asFile
        metadataFile.parentFile.mkdirs()
        def metadata = [
                jars: [[
                        identifier: [group: project.group.toString(), artifact: nestedModArtifact],
                        version: [range: "[${distributionVersion},)", artifactVersion: distributionVersion],
                        path: nestedModPath,
                        isObfuscated: false
                ]]
        ]
        metadataFile.setText(groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(metadata)) + System.lineSeparator(), "UTF-8")
    }
}

def bootstrapJar = tasks.register("bootstrapJar", Jar) {
    dependsOn(nestedModJar, generateBootstrapMetadata, tasks.named("processBootstrapResources"), tasks.named("processResources"))
    archiveClassifier = ""
    from(sourceSets.bootstrap.output)
    // Keep user-facing metadata at the physical root for launchers and catalogs. FML skips this wrapper as an
    // ordinary mod because early-service discovery has already placed the same physical path in the SERVICE layer.
    from(tasks.named("processResources")) {
        include "META-INF/neoforge.mods.toml"
        include "${mod_id}_logo_128x128.png"
    }
    from(bootstrapMetadataFile) {
        into "META-INF/jarjar"
    }
    from(nestedModJar.flatMap { it.archiveFile }) {
        into "META-INF/jarjar"
        rename { nestedModFileName }
    }
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${mod_name}" }
    }
    manifest {
        attributes([
                "FMLModType"             : "LIBRARY",
                "Automatic-Module-Name"  : "rinku_bootstrap",
                "Specification-Title"    : mod_name,
                "Specification-Vendor"   : mod_authors,
                "Specification-Version"  : mod_version,
                "Implementation-Title"   : mod_name,
                "Implementation-Version" : mod_version,
                "Implementation-Vendor"  : mod_authors,
                "Built-On-Java"          : "${System.getProperty('java.vm.version')} (${System.getProperty('java.vm.vendor')})",
                "Built-On-Minecraft"     : minecraft_version,
                "java-cef-commit"        : rootProject.jcefCommit
        ])
    }
}

def verifyBootstrapPackaging = tasks.register("verifyBootstrapPackaging") {
    dependsOn(bootstrapJar, nestedModJar, tasks.named("verifyJcefPackaging"))
    inputs.file(bootstrapJar.flatMap { it.archiveFile })
    inputs.file(nestedModJar.flatMap { it.archiveFile })
    inputs.property("nestedModPath", nestedModPath)
    doLast {
        def wrapperFile = bootstrapJar.get().archiveFile.get().asFile
        def modFile = nestedModJar.get().archiveFile.get().asFile
        byte[] nestedBytes
        Set<String> outerClasses
        new java.util.jar.JarFile(wrapperFile).withCloseable { wrapper ->
            def manifest = wrapper.manifest?.mainAttributes
            if (manifest?.getValue("FMLModType") != "LIBRARY") throw new GradleException("${wrapperFile} is not marked as an FML LIBRARY wrapper.")
            if (manifest?.getValue("Automatic-Module-Name") != "rinku_bootstrap") throw new GradleException("${wrapperFile} does not use the dedicated rinku_bootstrap module name.")
            if (wrapper.getJarEntry("META-INF/neoforge.mods.toml") == null || wrapper.getJarEntry("${mod_id}_logo_128x128.png") == null) throw new GradleException("${wrapperFile} is missing root metadata used by launchers and catalogs.")
            if (wrapper.getJarEntry("LICENSE_${mod_name}") == null) throw new GradleException("${wrapperFile} is missing the Rinku license.")

            def expectedServices = [
                    "META-INF/services/net.neoforged.neoforgespi.earlywindow.GraphicsBootstrapper": "de.keksuccino.rinku.platform.bootstrap.RinkuGraphicsBootstrapper",
                    "META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator": "de.keksuccino.rinku.platform.bootstrap.RinkuEmbeddedModLocator"
            ]
            def actualServicePaths = wrapper.entries().findAll { !it.directory && it.name.startsWith("META-INF/services/") }.collect { it.name }.toSet()
            if (actualServicePaths != expectedServices.keySet()) throw new GradleException("${wrapperFile} contains unexpected outer service descriptors: expected ${expectedServices.keySet()}, found ${actualServicePaths}.")
            expectedServices.each { servicePath, providerName ->
                def provider = wrapper.getInputStream(wrapper.getJarEntry(servicePath)).getText("UTF-8").trim()
                if (provider != providerName) throw new GradleException("${wrapperFile} declares unexpected provider ${provider} for ${servicePath}.")
            }

            def moduleDescriptor = java.lang.module.ModuleFinder.of(wrapperFile.toPath()).findAll().first().descriptor()
            if (moduleDescriptor.name() != "rinku_bootstrap") throw new GradleException("${wrapperFile} resolves as unexpected module ${moduleDescriptor.name()}.")
            def providedServices = moduleDescriptor.provides().collectEntries { provides -> [(provides.service()): provides.providers()] }
            expectedServices.each { servicePath, providerName ->
                def serviceName = servicePath.substring("META-INF/services/".length())
                if (providedServices.get(serviceName) != [providerName]) throw new GradleException("${wrapperFile}'s automatic module does not provide ${serviceName} with ${providerName}.")
            }

            outerClasses = wrapper.entries().findAll { !it.directory && it.name.endsWith(".class") }.collect { it.name }.toSet()
            def expectedOuterClasses = [
                    "de/keksuccino/rinku/platform/bootstrap/AwtHeadlessBootstrap.class",
                    "de/keksuccino/rinku/platform/bootstrap/RinkuGraphicsBootstrapper.class",
                    "de/keksuccino/rinku/platform/bootstrap/RinkuEmbeddedModLocator.class"
            ].toSet()
            if (outerClasses != expectedOuterClasses) throw new GradleException("${wrapperFile} contains unexpected outer classes: expected ${expectedOuterClasses}, found ${outerClasses}.")
            if (wrapper.getJarEntry("de/keksuccino/rinku/Rinku.class") != null) throw new GradleException("${wrapperFile} incorrectly places normal mod classes at the wrapper root.")
            if (wrapper.entries().any { !it.directory && it.name.startsWith("org/cef/") }) throw new GradleException("${wrapperFile} incorrectly places JCEF classes at the wrapper root.")
            if (wrapper.getJarEntry("rinku.mixins.json") != null || wrapper.getJarEntry("rinku.neoforge.mixins.json") != null) throw new GradleException("${wrapperFile} incorrectly places Mixin configurations at the wrapper root.")

            def metadataEntry = wrapper.getJarEntry("META-INF/jarjar/metadata.json")
            if (metadataEntry == null) throw new GradleException("${wrapperFile} is missing JarJar metadata.")
            def metadata = new groovy.json.JsonSlurper().parse(wrapper.getInputStream(metadataEntry))
            if (!(metadata?.jars instanceof List) || metadata.jars.size() != 1) throw new GradleException("${wrapperFile} must describe exactly one nested Rinku mod JAR.")
            def nestedMetadata = metadata.jars.first()
            if (nestedMetadata?.identifier?.group != project.group.toString() || nestedMetadata?.identifier?.artifact != nestedModArtifact) throw new GradleException("${wrapperFile} contains incorrect nested-mod coordinates.")
            if (nestedMetadata?.version?.range != "[${distributionVersion},)" || nestedMetadata?.version?.artifactVersion != distributionVersion) throw new GradleException("${wrapperFile} contains incorrect nested-mod version metadata.")
            if (nestedMetadata?.path != nestedModPath || nestedMetadata?.isObfuscated != false) throw new GradleException("${wrapperFile} contains incorrect nested-mod path or obfuscation metadata.")
            def nestedJarEntries = wrapper.entries().findAll { !it.directory && it.name.startsWith("META-INF/jarjar/") && it.name.endsWith(".jar") }.collect { it.name }
            if (nestedJarEntries != [nestedModPath]) throw new GradleException("${wrapperFile} must contain exactly the declared nested mod JAR; found ${nestedJarEntries}.")
            def nestedEntry = wrapper.getJarEntry(nestedModPath)
            if (nestedEntry == null) throw new GradleException("${wrapperFile} is missing ${nestedModPath}.")
            nestedBytes = wrapper.getInputStream(nestedEntry).readAllBytes()
        }

        if (!java.util.Arrays.equals(nestedBytes, modFile.bytes)) throw new GradleException("${wrapperFile} does not embed the exact verified ${modFile.name} bytes.")
        def extractedMod = new File(temporaryDir, nestedModFileName)
        extractedMod.parentFile.mkdirs()
        extractedMod.bytes = nestedBytes
        try {
            new java.util.jar.JarFile(extractedMod).withCloseable { mod ->
                if (mod.manifest?.mainAttributes?.getValue("Automatic-Module-Name") != mod_id) throw new GradleException("The nested Rinku mod does not use the stable ${mod_id} module name.")
                if (mod.manifest?.mainAttributes?.getValue("FMLModType") == "LIBRARY") throw new GradleException("The nested Rinku mod is incorrectly marked as an FML library.")
                if (mod.getJarEntry("META-INF/neoforge.mods.toml") == null) throw new GradleException("The nested Rinku mod is missing META-INF/neoforge.mods.toml.")
                if (mod.getJarEntry("de/keksuccino/rinku/Rinku.class") == null) throw new GradleException("The nested Rinku mod is missing its main class.")
                if (mod.getJarEntry("de/keksuccino/rinku/RinkuNeoForge.class") == null) throw new GradleException("The nested Rinku mod is missing its NeoForge entrypoint.")
                if (mod.getJarEntry("rinku.mixins.json") == null || mod.getJarEntry("rinku.neoforge.mixins.json") == null) throw new GradleException("The nested Rinku mod is missing one or more Mixin configurations.")
                if (mod.getJarEntry("org/cef/CefApp.class") == null) throw new GradleException("The nested Rinku mod is missing flat-merged JCEF classes.")
                if (mod.getJarEntry("META-INF/licenses/jcef/LICENSE.txt") == null) throw new GradleException("The nested Rinku mod is missing the JCEF license.")
                if (mod.getJarEntry("META-INF/services/net.neoforged.neoforgespi.earlywindow.GraphicsBootstrapper") != null) throw new GradleException("The nested Rinku mod must not identify itself as a graphics early-service JAR.")
                if (mod.getJarEntry("META-INF/services/net.neoforged.neoforgespi.locating.IModFileCandidateLocator") != null) throw new GradleException("The nested Rinku mod must not identify itself as an FML candidate-locator JAR.")
                def outerPackages = outerClasses.findAll { it.contains('/') }.collect { className -> className.substring(0, className.lastIndexOf('/')) }.toSet()
                def nestedPackages = mod.entries().findAll { !it.directory && it.name.endsWith(".class") && it.name.contains('/') }.collect { classEntry -> classEntry.name.substring(0, classEntry.name.lastIndexOf('/')) }.toSet()
                def splitPackages = outerPackages.intersect(nestedPackages)
                if (!splitPackages.isEmpty()) throw new GradleException("The bootstrap wrapper and nested mod contain split packages: ${splitPackages}.")
            }
        } finally {
            java.nio.file.Files.deleteIfExists(extractedMod.toPath())
        }
    }
}

jcefPackagedBinaryArchives.from(nestedModJar.flatMap { it.archiveFile })
tasks.named("verifyJcefPackaging").configure {
    dependsOn(nestedModJar)
}

tasks.named("assemble").configure {
    dependsOn(bootstrapJar)
}

def bootstrapTestTask = tasks.register("bootstrapTest", Test) {
    testClassesDirs = sourceSets.bootstrapTest.output.classesDirs
    classpath = sourceSets.bootstrapTest.runtimeClasspath
    useJUnitPlatform()
}

def verifyBootstrapPublicationOutputs = tasks.register("verifyBootstrapPublicationOutputs") {
    dependsOn(bootstrapJar, nestedModJar)
    inputs.file(bootstrapJar.flatMap { it.archiveFile })
    inputs.file(nestedModJar.flatMap { it.archiveFile })
    doLast {
        def expectedRuntime = bootstrapJar.get().archiveFile.get().asFile.canonicalFile
        def expectedApi = nestedModJar.get().archiveFile.get().asFile.canonicalFile
        def runtimeFiles = configurations.runtimeElements.outgoing.artifacts.files.files.collect { it.canonicalFile }.toSet()
        def apiFiles = configurations.apiElements.outgoing.artifacts.files.files.collect { it.canonicalFile }.toSet()
        if (runtimeFiles != [expectedRuntime].toSet()) throw new GradleException("NeoForge runtime publication must expose only ${expectedRuntime}; found ${runtimeFiles}.")
        if (apiFiles != [expectedApi].toSet()) throw new GradleException("NeoForge API publication must expose only ${expectedApi}; found ${apiFiles}.")
        if (bootstrapJar.get().archiveClassifier.get() != "") throw new GradleException("The physical release wrapper must be the unclassified runtime artifact.")
        if (nestedModJar.get().archiveClassifier.get() != "mod") throw new GradleException("The nested API artifact must retain the mod classifier.")
    }
}

tasks.named("check").configure {
    dependsOn(verifyBootstrapPackaging, verifyBootstrapPublicationOutputs, bootstrapTestTask)
}

configurations.named("apiElements").configure {
    outgoing.artifacts.clear()
    outgoing.artifact(nestedModJar)
}

configurations.named("runtimeElements").configure {
    outgoing.artifacts.clear()
    outgoing.artifact(bootstrapJar)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId "${mod_id}-neoforge"
            version "${mod_version}-${minecraft_version}"
            from components.java
            pom.withXml {
                def deps = asNode().get('dependencies')
                if (deps instanceof List) {
                    deps.each { asNode().remove(it) }
                }
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.named("build") {
    dependsOn("generatePomFileForMavenJavaPublication", "generateMetadataFileForMavenJavaPublication")
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = true
}

def stripModuleDepsTask = tasks.register("stripModuleDependencies") {
    def moduleFile = layout.buildDirectory.file("publications/mavenJava/module.json")
    inputs.file(moduleFile)
    outputs.file(moduleFile)
    doLast {
        def file = moduleFile.get().asFile
        if (!file.exists()) {
            return
        }
        def json = new groovy.json.JsonSlurper().parse(file)
        if (json?.variants) {
            json.variants = json.variants.findAll { variant ->
                !(variant instanceof Map) || variant.name != "accessTransformerElements"
            }
            json.variants.each { variant ->
                if (variant instanceof Map) {
                    variant.remove("dependencies")
                }
            }
        }
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}

tasks.named("generateMetadataFileForMavenJavaPublication") {
    finalizedBy(stripModuleDepsTask)
}

def verifyPublicationMetadata = tasks.register("verifyPublicationMetadata") {
    dependsOn("generatePomFileForMavenJavaPublication", "generateMetadataFileForMavenJavaPublication")
    mustRunAfter(stripModuleDepsTask)
    def moduleFile = layout.buildDirectory.file("publications/mavenJava/module.json")
    def pomFile = layout.buildDirectory.file("publications/mavenJava/pom-default.xml")
    inputs.files(moduleFile, pomFile)
    inputs.property("group", project.group.toString())
    inputs.property("artifact", nestedModArtifact)
    inputs.property("version", distributionVersion)
    doLast {
        def module = new groovy.json.JsonSlurper().parse(moduleFile.get().asFile)
        if (module?.component?.group != project.group.toString() || module?.component?.module != nestedModArtifact || module?.component?.version != distributionVersion) throw new GradleException("Gradle module metadata contains incorrect Rinku NeoForge coordinates.")
        def expectedVariantFiles = [
                apiElements: "${nestedModArtifact}-${distributionVersion}-mod.jar",
                runtimeElements: "${nestedModArtifact}-${distributionVersion}.jar",
                sourcesElements: "${nestedModArtifact}-${distributionVersion}-sources.jar"
        ]
        def variants = module?.variants instanceof List ? module.variants : []
        if (variants.collect { it.name }.toSet() != expectedVariantFiles.keySet()) throw new GradleException("Gradle module metadata contains unexpected variants: ${variants.collect { it.name }}.")
        variants.each { variant ->
            def expectedFile = expectedVariantFiles[variant.name]
            if (variant.containsKey("dependencies")) throw new GradleException("Gradle module metadata variant ${variant.name} exposes mapped development dependencies.")
            if (!(variant.files instanceof List) || variant.files.size() != 1 || variant.files.first()?.name != expectedFile || variant.files.first()?.url != expectedFile) throw new GradleException("Gradle module metadata variant ${variant.name} does not expose exactly ${expectedFile}.")
        }

        def pom = new groovy.xml.XmlSlurper(false, false).parse(pomFile.get().asFile)
        if (pom.groupId.text() != project.group.toString() || pom.artifactId.text() != nestedModArtifact || pom.version.text() != distributionVersion) throw new GradleException("The generated POM contains incorrect Rinku NeoForge coordinates.")
        if (!pom.depthFirst().findAll { it.name() == "dependency" }.isEmpty()) throw new GradleException("The generated POM exposes mapped development dependencies.")
    }
}

tasks.named("build").configure {
    dependsOn(verifyPublicationMetadata)
}
