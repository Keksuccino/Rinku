
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "net.fabricmc.fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

def enableRenderCompatibilityMods = providers.gradleProperty("rinku.enableRenderCompatibilityMods").map { it.toBoolean() }.orElse(true)

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    implementation "maven.modrinth:modmenu:20.0.0-beta.4"
    if (enableRenderCompatibilityMods.get()) {
        runtimeOnly "maven.modrinth:sodium:${sodium_version}"
        runtimeOnly "maven.modrinth:iris:${iris_version}"
    }
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}

loom {
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
    // Allow builds when there are test sources but no matching tests.
    failOnNoDiscoveredTests = false
}
tasks.named("sourcesJar", Jar) {
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId "${mod_id}-fabric"
            version "${mod_version}-${minecraft_version}"
            from components.java
            pom.withXml {
                def deps = asNode().get('dependencies')
                if (deps instanceof List) {
                    deps.each { asNode().remove(it) }
                }
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.named("build") {
    dependsOn("generatePomFileForMavenJavaPublication", "generateMetadataFileForMavenJavaPublication")
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = true
}

def stripModuleDepsTask = tasks.register("stripModuleDependencies") {
    def moduleFile = layout.buildDirectory.file("publications/mavenJava/module.json")
    inputs.file(moduleFile)
    outputs.file(moduleFile)
    doLast {
        def file = moduleFile.get().asFile
        if (!file.exists()) {
            return
        }
        def json = new groovy.json.JsonSlurper().parse(file)
        if (json?.variants) {
            json.variants.each { variant ->
                if (variant instanceof Map) {
                    variant.remove("dependencies")
                }
            }
        }
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}

tasks.named("generateMetadataFileForMavenJavaPublication") {
    finalizedBy(stripModuleDepsTask)
}

def verifyRenderCompatibilityRuntime = tasks.register("verifyRenderCompatibilityRuntime") {
    group = "verification"
    description = "Verifies the optional Sodium and Iris Fabric development runtime."
    inputs.property("enabled", enableRenderCompatibilityMods)
    inputs.property("sodiumVersion", sodium_version)
    inputs.property("irisVersion", iris_version)
    doLast {
        def expectedVersions = [sodium: sodium_version, iris: iris_version]
        def resolvedVersions = configurations.runtimeClasspath.resolvedConfiguration.resolvedArtifacts.findAll { artifact -> artifact.moduleVersion.id.group == "maven.modrinth" && expectedVersions.containsKey(artifact.name) }.collectEntries { artifact -> [(artifact.name): artifact.moduleVersion.id.version] }
        if (!enableRenderCompatibilityMods.get() && !resolvedVersions.isEmpty()) throw new GradleException("Fabric rendering compatibility mods were disabled but resolved ${resolvedVersions}.")
        if (enableRenderCompatibilityMods.get() && resolvedVersions != expectedVersions) throw new GradleException("Fabric rendering compatibility runtime resolved ${resolvedVersions}; expected ${expectedVersions}.")
    }
}

tasks.named("check") {
    dependsOn(verifyRenderCompatibilityRuntime)
}
