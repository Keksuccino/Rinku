
plugins {
    id 'java'
    id 'idea'
    id 'maven-publish'
    id "fabric-loom" version "$fabric_loom_version"
}

base {
    archivesName = "${mod_id}"
}

dependencies {

    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.layered() {
        officialMojangMappings()
        parchment("org.parchmentmc.data:parchment-${parchment_mc_version}:${parchment_version}@zip")
    }
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"
    implementation group: 'com.google.code.findbugs', name: 'jsr305', version: '3.0.1'
    implementation project(":common")
    include(implementation(annotationProcessor("io.github.llamalad7:mixinextras-fabric:${mixin_extras_version}")))
    modImplementation "maven.modrinth:modmenu:${modmenu_version}"
    modRuntimeOnly "maven.modrinth:sodium:mc1.19.2-0.4.4"
    modRuntimeOnly "maven.modrinth:iris:1.6.11+1.19.2"
    // Loom removes Sodium's nested-JAR declaration while remapping the Modrinth Maven artifact. Restore the
    // exact embedded JOML release to the development classpath so the 1.19.2 compatibility run matches the
    // published Sodium JAR instead of failing before Minecraft initializes.
    runtimeOnly "org.joml:joml:1.10.4"
    testImplementation "org.junit.jupiter:junit-jupiter-api:5.10.2"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine:5.10.2"
    testRuntimeOnly "org.junit.platform:junit-platform-launcher:1.10.2"

}

loom {
    mixin {
        useLegacyMixinAp = true
        defaultRefmapName.set("${mod_id}.refmap.json")
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
            sourceSet project(":common").sourceSets.main
        }
    }
    runs {
        client {
            client()
            setConfigName("Fabric Client")
            ideConfigGenerated(true)
            runDir("run_client")
        }
        server {
            server()
            setConfigName("Fabric Server")
            ideConfigGenerated(true)
            runDir("run_server")
        }
    }
}

tasks.named("compileJava", JavaCompile).configure {
    source(project(":common").sourceSets.main.allSource)
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
}
tasks.withType(Javadoc).configureEach {
    source(project(":common").sourceSets.main.allJava)
}
tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
tasks.named("sourcesJar", Jar) {
    dependsOn(project(":common").tasks.named("generateJcefRuntimeIdentity"))
    from(project(":common").sourceSets.main.allSource)
}

processResources {
    from project(":common").sourceSets.main.resources
}

def remapJarTask = tasks.named("remapJar")
def remappedJar = remapJarTask.flatMap { it.archiveFile }
def verifyFabricMixinRefmapPackaging = tasks.register("verifyFabricMixinRefmapPackaging") {
    group = "verification"
    description = "Verifies that every packaged Fabric Mixin configuration references a populated refmap."
    dependsOn(remapJarTask)
    inputs.file(remappedJar)
    doLast {
        def jarFile = remappedJar.get().asFile
        new java.util.jar.JarFile(jarFile).withCloseable { archive ->
            def fabricMetadataEntry = archive.getJarEntry("fabric.mod.json")
            if (fabricMetadataEntry == null) throw new GradleException("${jarFile} is missing fabric.mod.json.")

            def fabricMetadata = new groovy.json.JsonSlurper().parse(archive.getInputStream(fabricMetadataEntry))
            if (!(fabricMetadata.mixins instanceof List) || fabricMetadata.mixins.isEmpty()) throw new GradleException("${jarFile} does not declare any Mixin configurations in fabric.mod.json.")

            fabricMetadata.mixins.each { declaration ->
                def configName = declaration instanceof Map ? declaration.config : declaration
                if (!(configName instanceof String) || configName.isBlank()) throw new GradleException("${jarFile} contains an invalid Mixin configuration declaration: ${declaration}")

                def configEntry = archive.getJarEntry(configName)
                if (configEntry == null) throw new GradleException("${jarFile} is missing declared Mixin configuration ${configName}.")

                def config = new groovy.json.JsonSlurper().parse(archive.getInputStream(configEntry))
                def refmapName = config.refmap
                if (!(refmapName instanceof String) || refmapName.isBlank()) throw new GradleException("${configName} does not declare a Mixin refmap.")

                def refmapEntry = archive.getJarEntry(refmapName)
                if (refmapEntry == null || refmapEntry.size == 0) throw new GradleException("${jarFile} is missing populated Mixin refmap ${refmapName} referenced by ${configName}.")

                def refmap = new groovy.json.JsonSlurper().parse(archive.getInputStream(refmapEntry))
                if (!(refmap.mappings instanceof Map) || refmap.mappings.isEmpty()) throw new GradleException("Mixin refmap ${refmapName} referenced by ${configName} contains no mappings.")
            }
        }
    }
}

tasks.named("check").configure {
    dependsOn(verifyFabricMixinRefmapPackaging)
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            artifactId "${mod_id}-fabric"
            version "${mod_version}-${minecraft_version}"
            from components.java
            pom.withXml {
                def deps = asNode().get('dependencies')
                if (deps instanceof List) {
                    deps.each { asNode().remove(it) }
                }
            }
        }
    }
    repositories {
        maven {
            url "file://" + System.getenv("local_maven")
        }
    }
}

tasks.named("build") {
    dependsOn("generatePomFileForMavenJavaPublication", "generateMetadataFileForMavenJavaPublication")
}

tasks.withType(GenerateModuleMetadata).configureEach {
    enabled = true
}

def stripModuleDepsTask = tasks.register("stripModuleDependencies") {
    def moduleFile = layout.buildDirectory.file("publications/mavenJava/module.json")
    inputs.file(moduleFile)
    outputs.file(moduleFile)
    doLast {
        def file = moduleFile.get().asFile
        if (!file.exists()) {
            return
        }
        def json = new groovy.json.JsonSlurper().parse(file)
        if (json?.variants) {
            json.variants.each { variant ->
                if (variant instanceof Map) {
                    variant.remove("dependencies")
                }
            }
        }
        file.text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(json))
    }
}

tasks.named("generateMetadataFileForMavenJavaPublication") {
    finalizedBy(stripModuleDepsTask)
}
